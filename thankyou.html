<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Revathi Institutions</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="./images/Revathi.png" type="image/png" />

  <!-- Bootstrap 4.0 -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <style>
    /* ── Thank You Page ── */
    .ty-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f4f8ff 0%, #e8f8f7 100%);
      padding: 120px 20px 60px;
    }

    .ty-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 12px 48px rgba(26, 58, 110, 0.13);
      padding: 56px 48px 48px;
      text-align: center;
      max-width: 520px;
      width: 100%;
      animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Animated Checkmark ── */
    .ty-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 28px;
    }

    .ty-icon svg { width: 100%; height: 100%; }

    .ty-circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 3;
      stroke: #00b9ae;
      fill: none;
      animation: drawCircle 0.7s cubic-bezier(0.65, 0, 0.45, 1) 0.2s forwards;
    }

    .ty-circle-fill {
      fill: #00b9ae;
      opacity: 0;
      animation: fillIn 0.4s ease 0.9s forwards;
    }

    .ty-check {
      stroke-dasharray: 58;
      stroke-dashoffset: 58;
      stroke-width: 3.5;
      stroke: #fff;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      animation: drawCheck 0.35s cubic-bezier(0.65, 0, 0.45, 1) 1.1s forwards;
    }

    @keyframes drawCircle {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fillIn {
      to { opacity: 1; }
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* ── Text ── */
    .ty-title {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 30px;
      font-weight: 900;
      color: #1a3a6e;
      margin-bottom: 14px;
    }

    .ty-sub {
      font-size: 16px;
      color: #6b7a90;
      line-height: 1.75;
      margin-bottom: 32px;
    }

    .ty-sub strong {
      color: #2d3748;
    }

    .ty-divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, #00b9ae, #1a3a6e);
      border-radius: 2px;
      margin: 0 auto 28px;
    }

    .ty-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #1a3a6e, #00b9ae);
      color: #fff;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 13px 32px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0, 185, 174, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .ty-home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0, 185, 174, 0.45);
      color: #fff;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .ty-card { padding: 40px 24px 36px; }
      .ty-title { font-size: 24px; }
    }
  </style>
</head>
<body>
